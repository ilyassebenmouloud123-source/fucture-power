<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Facture</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-8">
<div class="max-w-3xl mx-auto bg-white p-10 rounded-2xl">
<h1 class="text-2xl font-black">FACTURE {{ numero }}</h1>
<p class="text-sm text-gray-500 mt-2">{{ date }}</p>

<div class="grid grid-cols-2 gap-8 mt-8">
<div><p class="text-xs text-gray-400">DE</p><h2 class="font-bold">{{ ent_nom }}</h2><p class="text-sm">{{ ent_adresse }}<br>{{ ent_tel }}<br>ICE: {{ ent_ice }}</p></div>
<div><p class="text-xs text-gray-400">CLIENT</p><h2 class="font-bold">{{ client }}</h2><p class="text-sm">{{ client_tel }}<br>ICE: {{ client_ice }}</p></div>
</div>

<div class="mt-8 border-t pt-4">
{{ items_html|safe }}
</div>

<div class="text-right mt-8">
<p class="text-xl font-black">TOTAL: {{ total }} DH</p>
<p class="text-sm text-gray-500">Sous-total: {{ sous_total }} DH</p>
</div>

<div class="mt-10 flex gap-3">
<button onclick="window.print()" class="bg-black text-white px-6 py-3 rounded-full">IMPRIMER PDF</button>
<a href="/" class="border px-6 py-3 rounded-full">Retour</a>
</div>
</div>
</body></html>
