<div style="max-width:400px; margin:auto; background:white; padding:20px; border-radius:20px; font-family:sans-serif;">

  <h3 style="text-align:center; font-size:13px; font-weight:bold; margin-bottom:20px;">VOS INFOS PRIVÉ</h3>

  <label style="font-size:11px; font-weight:bold;">Nom de votre société</label>
  <input type="text" id="company" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 15px 0;">

  <label style="font-size:11px; font-weight:bold;">ICE</label>
  <input type="text" id="ice" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 15px 0;">

  <label style="font-size:11px; font-weight:bold;">RC / IF / Adresse (optionnel)</label>
  <input type="text" id="rc" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 20px 0;">

  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <button onclick="effacerInfos()" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; background:white; font-size:12px;">Effacer mes infos</button>
    <button onclick="effacerHistorique()" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; background:white; font-size:12px;">Effacer Historique</button>
  </div>

  <a href="/" style="display:block; text-align:center; padding:14px; background:black; color:white; border-radius:25px; text-decoration:none; font-weight:bold; margin-top:10px;">➔ Créer une Facture</a>

</div>

<script>
function effacerInfos(){
  if(confirm("مسح كلشي؟")){
    localStorage.clear();
    document.getElementById('company').value='';
    document.getElementById('ice').value='';
    document.getElementById('rc').value='';
  }
}
function effacerHistorique(){
  localStorage.removeItem('historique');
  alert('Historique effacé');
}
</script>
