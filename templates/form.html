<div style="max-width:400px; margin:auto; background:white; padding:20px; border-radius:20px; font-family:sans-serif;">

  <h3 style="text-align:center; font-size:13px; font-weight:bold; margin-bottom:20px; letter-spacing:1px;">VOS INFOS PRIVÉ</h3>

  <label style="font-size:11px; font-weight:bold;">Nom de votre société</label>
  <input type="text" id="company" placeholder="Mon entreprise" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 15px 0;">

  <label style="font-size:11px; font-weight:bold;">ICE</label>
  <input type="text" id="ice" placeholder="ICE" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 15px 0;">

  <label style="font-size:11px; font-weight:bold;">RC / IF / Adresse</label>
  <input type="text" id="rc" placeholder="RC / IF..." style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin:8px 0 20px 0;">

  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <button onclick="effacerInfos()" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; background:white; font-size:12px; cursor:pointer;">Effacer mes infos</button>
    <button onclick="effacerHistorique()" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; background:white; font-size:12px; cursor:pointer;">Effacer Historique</button>
  </div>

  <button onclick="creerFacture()" style="width:100%; padding:14px; background:black; color:white; border-radius:25px; font-weight:bold; border:none; cursor:pointer;">→ Créer une Facture</button>

</div>

<script>
window.onload = function(){
  document.getElementById('company').value = localStorage.getItem('facture_company') || '';
  document.getElementById('ice').value = localStorage.getItem('facture_ice') || '';
  document.getElementById('rc').value = localStorage.getItem('facture_rc') || '';
}
function creerFacture(){
  localStorage.setItem('facture_company', document.getElementById('company').value);
  localStorage.setItem('facture_ice', document.getElementById('ice').value);
  localStorage.setItem('facture_rc', document.getElementById('rc').value);
  window.location.href = "/";
}
function effacerInfos(){
  if(confirm("مسح معلوماتك؟")){
    localStorage.removeItem('facture_company');
    localStorage.removeItem('facture_ice');
    localStorage.removeItem('facture_rc');
    document.getElementById('company').value='';
    document.getElementById('ice').value='';
    document.getElementById('rc').value='';
  }
}
function effacerHistorique(){
  localStorage.removeItem('historique_factures');
  alert('Historique effacé');
}
</script>
