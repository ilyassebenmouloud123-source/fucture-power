<div style="max-width:500px; margin:auto; background:white; padding:25px; border-radius:20px;">
  <h3 style="font-weight:bold; margin-bottom:20px; letter-spacing:1px;">VOS INFOS PRIVÉ</h3>

  <label style="font-size:12px;">Nom / Société</label>
  <input type="text" id="company" placeholder="Nom / Société" style="width:100%; padding:12px; border:1px solid #eee; border-radius:10px; margin:8px 0 15px 0; background:#f9f9f9;">

  <label style="font-size:12px;">ICE</label>
  <input type="text" id="ice" placeholder="ICE" style="width:100%; padding:12px; border:1px solid #eee; border-radius:10px; margin:8px 0 15px 0; background:#f9f9f9;">

  <label style="font-size:12px;">Tél / RC / IF / Adresse</label>
  <input type="text" id="tel" placeholder="Tél" style="width:100%; padding:12px; border:1px solid #eee; border-radius:10px; margin:8px 0 15px 0; background:#f9f9f9;">

  <p style="font-size:11px; color:#888; text-align:center; margin-top:10px;">كيتسجلو بوحدهم، المرة الجاية غادي تلقاهم</p>
</div>

<script>
// يعمّر المعلومات القديمة
document.getElementById('company').value = localStorage.getItem('company') || '';
document.getElementById('ice').value = localStorage.getItem('ice') || '';
document.getElementById('tel').value = localStorage.getItem('tel') || '';

// ملي كيكتب المقاول كيتسجلو بوحدهم بلا بوطونة
document.getElementById('company').addEventListener('input', (e)=> localStorage.setItem('company', e.target.value));
document.getElementById('ice').addEventListener('input', (e)=> localStorage.setItem('ice', e.target.value));
document.getElementById('tel').addEventListener('input', (e)=> localStorage.setItem('tel', e.target.value));
</script>
