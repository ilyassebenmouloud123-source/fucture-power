<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACTURE POWER V2</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:15px}
h1{text-align:center;color:#D4AF37}
.box{background:#1e1e1e;border:1px solid #D4AF37;border-radius:20px;padding:20px;max-width:600px;margin:auto}
input,select{width:100%;padding:12px;margin:6px 0;background:#2a2a2a;border:1px solid #444;color:white;border-radius:12px;box-sizing:border-box}
button{width:100%;padding:14px;background:#D4AF37;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:10px}
.ligne{display:flex;gap:5px}
.ligne select{flex:2}.ligne input{flex:1}
#hist{margin-top:20px}
.item{background:#2a2a2a;padding:12px;border-radius:12px;margin:6px 0}
#facture{background:white;color:black;border-radius:20px;padding:20px;max-width:600px;margin:20px auto;display:none}
@media print{body *{visibility:hidden}#facture,#facture *{visibility:visible}#facture{position:absolute;top:0;left:0;width:100%}}
</style></head>
<body>
<h1>FACTURE POWER V2 ✨</h1>
<p style="text-align:center;color:#aaa">VERSION JDIDA - Ila ban lik had l-ktba, rah l-code khdam</p>

<div class="box">
<p><b>1. MOUL L-MAHAL (Li kay-kteb)</b></p>
<input id="vNom" placeholder="Smiya dyal l-mahal / Smiytek">
<input id="vTel" placeholder="Nmra dyalek">
<input id="vMail" placeholder="Gmail dyalek">

<p><b>2. CLIENT</b></p>
<input id="cNom" placeholder="Smiya dyal Client">
<input id="cTel" placeholder="Téléphone Client">

<p><b>3. SERVICES</b></p>
<div id="lignes"></div>
<button onclick="zid()" style="background:#333;color:#D4AF37;border:1px dashed #D4AF37">+ ZID LIGNE</button>

<h2 id="total">Total: 0 DH</h2>
<button onclick="sayeb()">SAYEB FACTURE</button>
<button onclick="window.print()" style="background:white">IMPRIMER / PDF</button>

<div id="hist"><h3>📜 HISTORIQUE</h3><div id="histList">Ba9i walo</div></div>
</div>

<div id="facture">
<h2 style="color:#B8860B">FACTURE POWER</h2>
<p id="fV"></p><p id="fC"></p><hr>
<div id="fLignes"></div>
<h2 id="fTotal"></h2>
<p style="text-align:center">MERCI POUR VOTRE CONFIANCE ✨</p>
</div>

<script>
function ligne(){
  return '<div class="ligne"><select><option>iPhone 13</option><option>iPhone 14</option><option>Réparation Écran</option><option>Réparation Batterie</option><option>Accessoires</option><option>Autre</option></select><input type="number" value="1" class="q" oninput="calc()"><input type="number" placeholder="Prix" class="p" oninput="calc()"><button onclick="this.parentElement.remove();calc()" style="width:40px;background:red;color:white">X</button></div>';
}
function zid(){document.getElementById("lignes").innerHTML += ligne();}
zid(); zid();
function calc(){
  let t=0;
  document.querySelectorAll(".ligne").forEach(function(l){
    let q = Number(l.querySelector(".q").value) || 0;
    let p = Number(l.querySelector(".p").value) || 0;
    t += q*p;
  });
  document.getElementById("total").innerText = "Total: " + t + " DH";
  return t;
}
function sayeb(){
  let t = calc();
  let c = document.getElementById("cNom").value;
  if(!c){alert("Kteb smiya dyal client"); return;}
  document.getElementById("facture").style.display="block";
  document.getElementById("fV").innerText = document.getElementById("vNom").value + " | " + document.getElementById("vTel").value + " | " + document.getElementById("vMail").value;
  document.getElementById("fC").innerText = "Client: " + c + " | " + document.getElementById("cTel").value;
  let h="";
  document.querySelectorAll(".ligne").forEach(function(l){
    let s=l.querySelector("select").value;
    let q=Number(l.querySelector(".q").value)||0;
    let p=Number(l.querySelector(".p").value)||0;
    if(p>0) h += "<p>"+s+" x"+q+" = "+(q*p)+" DH</p>";
  });
  document.getElementById("fLignes").innerHTML=h;
  document.getElementById("fTotal").innerText="TOTAL: "+t+" DH";
  let old = JSON.parse(localStorage.getItem("f")||"[]");
  old.unshift(c+" - "+t+" DH");
  localStorage.setItem("f",JSON.stringify(old.slice(0,10)));
  showHist();
  document.getElementById("facture").scrollIntoView();
}
function showHist(){
  let old = JSON.parse(localStorage.getItem("f")||"[]");
  if(old.length==0) return;
  document.getElementById("histList").innerHTML = old.map(function(x){return '<div class="item">'+x+'</div>'}).join("");
}
showHist();
</script>
</body></html>
