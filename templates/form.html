<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACTURE POWER</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif}</style>
</head>
<body class="bg-[#eef2ff] min-h-screen">
<nav class="bg-white border-b sticky top-0">
<div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-black flex items-center justify-center text-white font-black">FP</div>
<p class="font-extrabold">FACTURE <span class="text-blue-600">POWER</span></p>
<span class="ml-3 text-[10px] bg-blue-600 text-white px-3 py-1 rounded-full font-bold">V2 PREMIUM</span>
</div>
</nav>
<div class="max-w-5xl mx-auto px-6 py-10">
<div class="bg-white rounded-[28px] shadow-xl border p-8 max-w-2xl mx-auto">
<h1 class="text-3xl font-extrabold mb-2">Nouvelle facture</h1>
<p class="text-gray-400 text-sm mb-8">Design premium • Prêt à imprimer</p>
<form method="POST" action="/create" class="space-y-6">
<input name="client" placeholder="Nom du client" required class="w-full px-4 py-3.5 rounded-xl bg-zinc-50 border">
<div class="grid grid-cols-2 gap-4">
<input name="numero" value="FAC-2026-001" class="px-4 py-3.5 rounded-xl bg-zinc-50 border">
<input name="date" type="date" class="px-4 py-3.5 rounded-xl bg-zinc-50 border">
</div>
<div id="items" class="space-y-3">
<div class="flex gap-2">
<input name="nom[]" placeholder="Désignation" required class="flex-1 px-4 py-3 rounded-xl bg-zinc-900 text-white">
<input name="qte[]" type="number" value="1" class="w-20 px-3 py-3 rounded-xl bg-zinc-900 text-white text-center">
<input name="prix[]" type="number" placeholder="Prix" required class="w-28 px-3 py-3 rounded-xl bg-zinc-900 text-white text-center">
</div>
</div>
<button type="button" onclick="document.getElementById('items').innerHTML += `<div class='flex gap-2 mt-2'><input name='nom[]' placeholder='Désignation' required class='flex-1 px-4 py-3 rounded-xl bg-zinc-900 text-white'><input name='qte[]' type='number' value='1' class='w-20 px-3 py-3 rounded-xl bg-zinc-900 text-white text-center'><input name='prix[]' type='number' placeholder='Prix' required class='w-28 px-3 py-3 rounded-xl bg-zinc-900 text-white text-center'></div>`" class="w-full border-2 border-dashed rounded-xl py-3 font-bold text-zinc-500">+ Ajouter un article</button>
<button class="w-full bg-gradient-to-r from-blue-600 to-black text-white rounded-xl p-4 font-extrabold text-lg">⚡ Générer la facture</button>
</form>
</div>
</div>
</body>
</html>
