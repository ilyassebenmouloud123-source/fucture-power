<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facture Power Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white p-4">
<div class="max-w-3xl mx-auto">
  <div class="text-center py-8">
    <h1 class="text-4xl font-black">FACTURE<span class="text-blue-500">POWER</span></h1>
    <p class="text-zinc-400 mt-2">سيستيم فاتورات عصري وسريع</p>
  </div>
  <form method="POST" class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-6 space-y-5">
    <div class="grid grid-cols-2 gap-4">
      <input name="client" required placeholder="سمية الكليان / الشركة" class="col-span-2 bg-zinc-800 border border-zinc-700 rounded-xl p-3 outline-none">
      <input name="ice" placeholder="ICE الشركة" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3">
      <input name="date" type="date" value="{{ today }}" class="bg-zinc-800 border border-zinc-700 rounded-xl p-3">
    </div>
    <div id="items" class="space-y-3">
      <div class="flex gap-2">
        <input name="nom[]" placeholder="المنتج / الخدمة" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl p-3">
        <input name="qte[]" type="number" value="1" class="w-20 bg-zinc-800 border border-zinc-700 rounded-xl p-3">
        <input name="prix[]" type="number" placeholder="الثمن" class="w-24 bg-zinc-800 border border-zinc-700 rounded-xl p-3">
      </div>
    </div>
    <button type="button" onclick="addItem()" class="w-full border border-dashed border-zinc-600 rounded-xl p-3 text-zinc-400">+ زيد منتج آخر</button>
    <button class="w-full bg-blue-600 rounded-xl p-4 font-bold text-lg">إنشاء الفاتورة 🚀</button>
  </form>
</div>
<script>
function addItem(){
  document.getElementById('items').innerHTML += `<div class="flex gap-2"><input name="nom[]" placeholder="المنتج" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl p-3"><input name="qte[]" type="number" value="1" class="w-20 bg-zinc-800 border border-zinc-700 rounded-xl p-3"><input name="prix[]" type="number" placeholder="الثمن" class="w-24 bg-zinc-800 border border-zinc-700 rounded-xl p-3"></div>`;
}
</script>
</body>
</html>
