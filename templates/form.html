<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACTURE POWER</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;background:#eef2f7;color:#1e293b;padding:18px}
.container{max-width:680px;margin:auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.top{text-align:center}
.top h1{margin:8px 0 0;font-size:34px;color:#0f172a}
.top h1 span{color:#2563eb}
.top p{color:#64748b;font-size:14px}
.logo-box{width:110px;height:110px;margin:auto;border:2px dashed #cbd5e1;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f8fafc;cursor:pointer;position:relative}
.logo-box img{width:100%;height:100%;object-fit:cover;display:none}
.logo-box b{font-size:12px;color:#94a3b8;text-align:center;padding:10px}
.logo-input{display:none}
h2{font-size:17px;margin:28px 0 12px;padding-left:12px;border-left:4px solid #2563eb}
label{display:block;font-size:14px;font-weight:600;color:#334155;margin:14px 0 6px}
label span{font-weight:400;color:#64748b;float:right}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:12px;background:#f8fafc;font-size:15px;outline:none}
input:focus,select:focus{border-color:#2563eb;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.total{background:#eff6ff;border:1px dashed #93c5fd;border-radius:14px;padding:16px;text-align:center;margin-top:22px}
.total b{font-size:28px;color:#1d4ed8}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.dark{background:#0f172a;color:#fff}.gray{background:#e2e8f0;color:#334155}
</style>
</head>
<body>
<div class="container">
<div class="top">

<!-- LOGO -->
<label style="text-align:center">Logo du magasin <span style="float:none">| شعار المحل</span></label>
<div class="logo-box" onclick="document.getElementById('logoInput').click()">
<img id="logoPreview">
<b id="logoText">+ Ajouter<br>le logo<br>أضف الشعار</b>
</div>
<input type="file" id="logoInput" class="logo-input" accept="image/*" onchange="loadLogo(event)">
<button class="btn gray" onclick="document.getElementById('logoInput').click()">Choisir le logo | اختيار الشعار</button>
<button class="btn gray" onclick="removeLogo()" style="margin-top:6px;padding:10px;font-size:13px">Supprimer le logo | حذف الشعار</button>

<h1>FACTURE <span>POWER</span></h1>
<p>Créer une facture professionnelle | إنشاء فاتورة احترافية</p>
</div>

<h2>1. Émetteur | المُرسل</h2>
<label>Nom du magasin <span>اسم المحل</span></label>
<input id="shop" placeholder="Nom du magasin">
<label>Téléphone <span>رقم الهاتف</span></label>
<input id="phone1" placeholder="06 XX XX XX XX">
<label>Email <span>البريد الإلكتروني</span></label>
<input id="email" placeholder="exemple@gmail.com">

<h2>2. Client | الزبون</h2>
<label>Nom et prénom du client <span>اسم الزبون</span></label>
<input id="client" placeholder="Nom et prénom du client">
<label>Téléphone du client <span>هاتف الزبون</span></label>
<input id="phone2" placeholder="Téléphone du client">

<h2>3. Services / Produits | الخدمات / المنتجات</h2>
<label>Service 1 <span>الخدمة 1</span></label>
<div class="row">
<select id="s1"><option>iPhone 13</option><option>iPhone 14</option><option>iPhone 15</option><option>Réparation Écran | إصلاح الشاشة</option><option>Réparation Batterie | إصلاح البطارية</option><option>Accessoire | إكسسوار</option></select>
<input id="q1" type="number" value="1" placeholder="Quantité | الكمية">
<input id="p1" type="number" placeholder="Prix (DH) | الثمن">
</div>
<label>Service 2 <span>الخدمة 2</span></label>
<div class="row">
<select id="s2"><option>iPhone 13</option><option>iPhone 14</option><option>Réparation Écran | إصلاح الشاشة</option><option>Accessoire | إكسسوار</option></select>
<input id="q2" type="number" value="1" placeholder="Quantité | الكمية">
<input id="p2" type="number" placeholder="Prix (DH) | الثمن">
</div>

<div class="total"><div>Total | المجموع</div><b id="total">0 DH</b></div>
<button class="btn blue" onclick="calc()">Calculer le Total | حساب المجموع</button>
<button class="btn green" onclick="window.print()">Imprimer / PDF | طباعة / تحميل</button>
<button class="btn dark" onclick="sendWA()">Envoyer sur WhatsApp | إرسال عبر واتساب</button>
</div>

<script>
function loadLogo(e){
let f=e.target.files[0]; if(!f) return;
let r=new FileReader();
r.onload=function(ev){
document.getElementById('logoPreview').src=ev.target.result;
document.getElementById('logoPreview').style.display='block';
document.getElementById('logoText').style.display='none';
localStorage.setItem('myLogo',ev.target.result);
};
r.readAsDataURL(f);
}
function removeLogo(){
document.getElementById('logoPreview').src='';document.getElementById('logoPreview').style.display='none';
document.getElementById('logoText').style.display='block';
localStorage.removeItem('myLogo');
}
window.onload=function(){
let saved=localStorage.getItem('myLogo');
if(saved){document.getElementById('logoPreview').src=saved;document.getElementById('logoPreview').style.display='block';document.getElementById('logoText').style.display='none';}
};
function calc(){
let t=(+document.getElementById('q1').value||0)*(+document.getElementById('p1').value||0)+(+document.getElementById('q2').value||0)*(+document.getElementById('p2').value||0);
document.getElementById('total').innerText=t+' DH';return t;
}
function sendWA(){let t=calc();let msg='FACTURE POWER%0AClient: '+document.getElementById('client').value+'%0ATotal: '+t+' DH';window.open('https://wa.me/'+document.getElementById('phone2').value+'?text='+msg);}
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));
</script>
</body>
</html>
