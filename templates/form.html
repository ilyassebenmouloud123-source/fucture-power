<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACTURE POWER - VOS INFOS</title>
</head>
<body style="font-family: sans-serif; padding:20px; max-width:500px; margin:auto; background:#f5f5f5;">

<h2 style="font-weight:900;">VOS INFOS PRIVÉ</h2>

<!-- === BOUTONS SAUVEGARDE === -->
<div style="display:flex; gap:8px; margin:12px 0;">
  <button onclick="sauvegarderInfos()" type="button" style="flex:1; padding:10px; background:black; color:white; border-radius:25px; font-size:12px; font-weight:bold; border:none;">📥 Sauvegarder</button>
  <button onclick="document.getElementById('fileRestaurer').click()" type="button" style="flex:1; padding:10px; background:white; border:1px solid black; color:black; border-radius:25px; font-size:12px; font-weight:bold;">📤 Restaurer</button>
</div>
<input type="file" id="fileRestaurer" accept=".json" style="display:none" onchange="restaurerInfos(event)">

<!-- EXEMPLE DE CHAMPS - خلي الحقول ديالك هنا -->
<input id="nom" placeholder="Nom / Société" style="width:100%; padding:12px; margin:6px 0; border-radius:10px; border:1px solid #ddd;">
<input id="ice" placeholder="ICE" style="width:100%; padding:12px; margin:6px 0; border-radius:10px; border:1px solid #ddd;">
<input id="tel" placeholder="Tél" style="width:100%; padding:12px; margin:6px 0; border-radius:10px; border:1px solid #ddd;">

<p style="font-size:10px; color:#888; margin-top:20px; text-align:center;">Même si vous fermez le navigateur, vos infos restent. Si vous effacez le cache, utilisez Restaurer.</p>

<!-- === SCRIPT LI KIHAFED LMA3LOMAT === -->
<script>
// حفظ تلقائي ملي كتكتب
document.querySelectorAll('input').forEach(inp=>{
  let key = 'facture_'+inp.id;
  let saved = localStorage.getItem(key);
  if(saved) inp.value = saved;
  inp.addEventListener('input', ()=>{ localStorage.setItem(key, inp.value); });
});

function sauvegarderInfos() {
  let data = {};
  for (let i = 0; i < localStorage.length; i++) {
    let k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  let blob = new Blob([JSON.stringify(data)], {type: "application/json"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = "mes-infos-facturepower.json";
  a.click();
  alert("✅ تم الحفظ! خبي الفايل ف Drive");
}

function restaurerInfos(event) {
  let file = event.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = function(e) {
    try {
      let data = JSON.parse(e.target.result);
      for (let k in data) { localStorage.setItem(k, data[k]); }
      alert("✅ رجعو معلوماتك كاملين!");
      location.reload();
    } catch(err) { alert("❌ الفايل فيه مشكل"); }
  };
  reader.readAsText(file);
}
</script>

</body>
</html>
