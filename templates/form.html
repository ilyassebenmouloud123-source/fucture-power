<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACTURE POWER - LUXURY</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif;background:#f8f7f3}.serif{font-family:'Cormorant Garamond',serif}.gold{color:#B8860B}.bg-gold{background:linear-gradient(135deg,#D4AF37,#B8860B)}</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-2xl mx-auto bg-white rounded-[32px] shadow-[0_30px_80px_-20px_rgba(0,0,0,0.15)] border border-[#efe9d7] overflow-hidden">
<div class="p-8 flex items-center gap-3 border-b border-[#efe9d7]"><div class="w-12 h-12 rounded-2xl bg-black flex items-center justify-center text-[#D4AF37] font-black">FP</div><div><p class="font-black tracking-[0.2em] text-[13px]">FACTURE POWER</p><p class="text-[10px] tracking-[0.3em] gold">LUXURY EDITION</p></div></div>
<div class="p-8">
<form action="/facture" method="POST">
<h2 class="font-bold text-[11px] tracking-[0.3em] mb-5">VOS INFOS PRIVÉ</h2>
<input name="ent_nom" id="company" placeholder="Nom / Société" required class="w-full border border-[#efe9d7] rounded-2xl p-4 mb-3 bg-[#fcfbf7]">
<input name="ent_ice" id="ice" placeholder="ICE" class="w-full border border-[#efe9d7] rounded-2xl p-4 mb-3 bg-[#fcfbf7]">
<input name="ent_adresse" id="rc" placeholder="RC / IF / Adresse / Tél" class="w-full border border-[#efe9d7] rounded-2xl p-4 mb-6 bg-[#fcfbf7]">

<h2 class="font-bold text-[11px] tracking-[0.3em] mb-5">CLIENT</h2>
<input name="client" placeholder="Nom du client" required class="w-full border rounded-2xl p-4 mb-3">
<input name="client_tel" placeholder="Tél Client" class="w-full border rounded-2xl p-4 mb-6">

<h2 class="font-bold text-[11px] tracking-[0.3em] mb-5">DÉTAILS</h2>
<div id="items"><div class="flex gap-2 mb-2"><input name="nom" placeholder="Désignation" required class="flex-1 border rounded-2xl p-4"><input name="qte" type="number" value="1" class="w-20 border rounded-2xl p-4"><input name="prix" type="number" placeholder="Prix" required class="w-28 border rounded-2xl p-4"></div></div>

<button type="submit" class="w-full bg-black text-white rounded-full p-4 font-bold mt-8 tracking-wide">GÉNÉRER FACTURE LUXURY →</button>
</form>
<p class="text-[11px] text-zinc-400 text-center mt-4">معلومات شركتك كيتسجلو أوتوماتيك - بلا بوطونات</p>
</div>
</div>
<script>
const c=document.getElementById('company'),i=document.getElementById('ice'),r=document.getElementById('rc');
c.value=localStorage.getItem('company')||''; i.value=localStorage.getItem('ice')||''; r.value=localStorage.getItem('rc')||'';
[c,i,r].forEach(el=>el.addEventListener('input',()=>{localStorage.setItem('company',c.value);localStorage.setItem('ice',i.value);localStorage.setItem('rc',r.value)}));
</script>
</body></html>
