<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACTURE POWER - LUXURY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#f8f7f3}
.serif{font-family:'Cormorant Garamond',serif}
.gold{color:#B8860B}

/* ===== HNA L'IMPRESSION - MAKAYBDELCH DESIGN F L'ECRAN ===== */
@media print{
  .no-print, button, input[type="file"]{display:none !important}
  body{background:white !important; padding:0 !important}
  .facture-box{box-shadow:none !important; border:none !important; margin:0 !important; max-width:100% !important; border-radius:0 !important}
  input, textarea, select{
    border:none !important; border-bottom:1px solid #eee !important;
    background:transparent !important; box-shadow:none !important;
    padding:4px 0 !important; -webkit-appearance:none; appearance:none;
  }
  input::placeholder, textarea::placeholder{color:transparent !important}
  select{border:none !important}
}
@page{size:A4; margin:12mm}
</style>
</head>
<body class="min-h-screen p-3 md:p-6">

<!-- BOUTON IMPRIMER - KAYBAN GHIR F L'ECRAN, MAKAYBANCH F L'WER9A -->
<div class="no-print text-center mb-4">
  <button onclick="window.print()" style="background:black;color:white;padding:14px 30px;border-radius:30px;border:none;font-weight:bold;cursor:pointer">🖨️ IMPRIMER / PDF</button>
</div>

<div class="facture-box max-w-3xl mx-auto bg-white rounded-[32px] shadow-[0_30px_80px_-20px_rgba(0,0,0,0.15)] border border-[#efe9d7] overflow-hidden">

<!-- HEADER -->
<div class="p-8 border-b border-[#efe9d7] flex justify-between items-center">
  <div class="flex items-center gap-4">
    <label class="no-print w-16 h-16 bg-black rounded-2xl flex items-center justify-center overflow-hidden cursor-pointer relative">
      <img id="logoPreview" class="hidden w-full h-full object-cover">
      <span id="logoText" class="text-[#D4AF37] font-black text-xl">FP</span>
      <input type="file" id="logoInput" class="hidden" accept="image/*">
    </label>
    <div id="logoPrint" class="hidden"><img id="logoPrintImg" class="w-16 h-16 object-contain"></div>
    <div><p class="font-black tracking-[0.2em] text-[14px]">FACTURE POWER</p><p class="text-[10px] tracking-[0.3em] gold">LUXURY EDITION</p></div>
  </div>
</div>

<div class="p-8">
  <div class="text-center mb-8">
    <h1 class="serif text-[42px] font-bold tracking-[0.2em]">FACTURE</h1>
    <p class="text-[10px] tracking-[0.3em] gold mt-1">ELEGANCE • QUALITÉ • CONFIANCE</p>
  </div>

  <!-- 1. EMETTEUR -->
  <h2 class="font-bold text-[11px] tracking-[0.3em] mb-4">1. Émetteur | المرسل</h2>
  <div class="no-print flex gap-2 mb-4 flex-wrap" id="historic"></div>
  <input id="company" placeholder="Nom du magasin" class="w-full border border-[#efe9d7] rounded-2xl p-4 mb-3 bg-[#fcfbf7] text-sm">
  <div class="grid grid-cols-2 gap-3 mb-3">
    <input id="ice" placeholder="ICE" class="border border-[#efe9d7] rounded-2xl p-4 bg-[#fcfbf7] text-sm">
    <input id="rc" placeholder="RC / IF" class="border border-[#efe9d7] rounded-2xl p-4 bg-[#fcfbf7] text-sm">
  </div>
  <input id="adresse" placeholder="Adresse" class="w-full border border-[#efe9d7] rounded-2xl p-4 mb-3 bg-[#fcfbf7] text-sm">
  <div class="grid grid-cols-2 gap-3 mb-8">
    <input id="tel" placeholder="Téléphone" class="border border-[#efe9d7] rounded-2xl p-4 bg-[#fcfbf7] text-sm">
    <input id="email" placeholder="Email" class="border border-[#efe9d7] rounded-2xl p-4 bg-[#fcfbf7] text-sm">
  </div>

  <!-- 2. CLIENT -->
  <h2 class="font-bold text-[11px] tracking-[0.3em] mb-4">2. Client | الزبون</h2>
  <input id="client" placeholder="Nom et prénom du client" class="w-full border rounded-2xl p-4 mb-3 text-sm">
  <div class="grid grid-cols-2 gap-3 mb-8">
    <input id="clientTel" placeholder="Téléphone du client" class="border rounded-2xl p-4 text-sm">
    <input id="clientIce" placeholder="ICE Client" class="border rounded-2xl p-4 text-sm">
  </div>

  <!-- 3. SERVICES -->
  <h2 class="font-bold text-[11px] tracking-[0.3em] mb-4">3. Services / Produits | الخدمات</h2>
  <div id="items">
    <div class="flex gap-2 mb-2"><input placeholder="Service 1" class="flex-1 border rounded-2xl p-4 text-sm nom"><input type="number" value="1" class="w-20 border rounded-2xl p-4 text-sm qte"><input type="number" placeholder="Prix" class="w-28 border rounded-2xl p-4 text-sm prix"></div>
  </div>
  <button type="button" onclick="addItem()" class="no-print text-xs gold font-bold mt-2">+ Ajouter une ligne</button>

  <!-- TOTAUX -->
  <div class="grid grid-cols-3 gap-3 mt-8">
    <div><label class="text-[10px] text-zinc-400">Remise %</label><input id="remise" type="number" value="0" class="w-full border rounded-xl p-3 text-sm"></div>
    <div><label class="text-[10px] text-zinc-400">TVA %</label><select id="tva" class="w-full border rounded-xl p-3 text-sm"><option value="0">0%</option><option value="20" selected>20%</option><option value="10">10%</option></select></div>
    <div><label class="text-[10px] text-zinc-400">Paiement</label><select id="paiement" class="w-full border rounded-xl p-3 text-sm"><option>Espèces</option><option>Virement</option><option>Chèque</option></select></div>
  </div>

  <textarea id="notes" placeholder="Notes / Conditions..." class="w-full border rounded-2xl p-4 mt-6 text-sm h-20"></textarea>

  <div class="mt-6 text-right">
    <p id="totalDisplay" class="font-black text-[18px]">TOTAL: 0 DH</p>
  </div>
</div>
</div>

<script>
// LOGO - kayban f l'ecran o f l'impression
const logoInput=document.getElementById('logoInput'),logoPreview=document.getElementById('logoPreview'),logoText=document.getElementById('logoText');
logoInput.addEventListener('change',e=>{const r=new FileReader();r.onload=()=>{localStorage.setItem('logo',r.result);showLogo()};r.readAsDataURL(e.target.files[0])});
function showLogo(){const l=localStorage.getItem('logo');if(l){logoPreview.src=l;logoPreview.classList.remove('hidden');logoText.classList.add('hidden');document.getElementById('logoPrintImg').src=l}}showLogo();

// HISTORIC
const c=document.getElementById('company'),ic=document.getElementById('ice'),rcEl=document.getElementById('rc'),ad=document.getElementById('adresse'),tel=document.getElementById('tel'),em=document.getElementById('email');
c.value=localStorage.getItem('company')||'';ic.value=localStorage.getItem('ice')||'';rcEl.value=localStorage.getItem('rc')||'';ad.value=localStorage.getItem('adresse')||'';tel.value=localStorage.getItem('tel')||'';em.value=localStorage.getItem('email')||'';
let hist=JSON.parse(localStorage.getItem('historic')||'[]');
function renderHistoric(){const d=document.getElementById('historic');d.innerHTML='';hist.slice(0,5).forEach(h=>{const b=document.createElement('button');b.type='button';b.innerText=h.company;b.className='text-[11px] bg-[#fcf9ef] border border-[#efe9d7] px-3 py-1.5 rounded-full';b.onclick=()=>{c.value=h.company;ic.value=h.ice;rcEl.value=h.rc;ad.value=h.adresse;tel.value=h.tel;em.value=h.email;save()};d.appendChild(b)})}
renderHistoric();
function save(){localStorage.setItem('company',c.value);localStorage.setItem('ice',ic.value);localStorage.setItem('rc',rcEl.value);localStorage.setItem('adresse',ad.value);localStorage.setItem('tel',tel.value);localStorage.setItem('email',em.value);if(c.value&&!hist.find(x=>x.company==c.value)){hist.unshift({company:c.value,ice:ic.value,rc:rcEl.value,adresse:ad.value,tel:tel.value,email:em.value});localStorage.setItem('historic',JSON.stringify(hist.slice(0,10)));renderHistoric()}}
[c,ic,rcEl,ad,tel,em].forEach(el=>el.addEventListener('input',save));

function addItem(){const div=document.createElement('div');div.className='flex gap-2 mb-2';div.innerHTML='<input placeholder="Service" class="flex-1 border rounded-2xl p-4 text-sm nom"><input type="number" value="1" class="w-20 border rounded-2xl p-4 text-sm qte"><input type="number" placeholder="Prix" class="w-28 border rounded-2xl p-4 text-sm prix"><button type="button" onclick="this.parentElement.remove();calc()" class="no-print text-red-400 text-xs">✕</button>';document.getElementById('items').appendChild(div);calc()}
function calc(){let t=0;document.querySelectorAll('#items > div').forEach(r=>{let q=parseFloat(r.querySelector('.qte').value||1);let p=parseFloat(r.querySelector('.prix').value||0);t+=q*p});let rem=parseFloat(document.getElementById('remise').value||0);let tva=parseFloat(document.getElementById('tva').value||0);let apres=t-(t*rem/100);let total=apres+(apres*tva/100);document.getElementById('totalDisplay').innerText='TOTAL: '+total.toFixed(2)+' DH'}
document.addEventListener('input',calc);calc();

// 9bel l'impression: 7yed les lignes khawyin bach maybanoch f l'wer9a
window.onbeforeprint=()=>{document.querySelectorAll('#items > div').forEach(r=>{let nom=r.querySelector('.nom').value.trim();let prix=r.querySelector('.prix').value.trim();if(!nom&&!prix){r.dataset.hide='1';r.style.display='none'}})};
window.onafterprint=()=>{document.querySelectorAll('#items > div').forEach(r=>{if(r.dataset.hide){r.style.display='';delete r.dataset.hide}})};
</script>
</body></html>
