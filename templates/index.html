<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACTURE POWER - PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif}.serif{font-family:'Cormorant Garamond',serif}.gold{color:#D4AF37}.bg-gold{background:linear-gradient(135deg,#D4AF37,#B8860B)}input,select{outline:none}input:focus,select:focus{border-color:#D4AF37!important}@media print{.no-print{display:none}body{background:white}}</style>
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white p-4 md:p-8">

<!-- HEADER -->
<div class="max-w-5xl mx-auto text-center mb-8">
  <p class="serif text-4xl md:text-5xl font-bold tracking-wide">FACTURE <span class="gold">POWER</span></p>
  <p class="text-[11px] tracking-[0.4em] text-zinc-400 mt-2">✦ LUXURY EDITION • PRO ✦</p>
</div>

<div class="max-w-5xl mx-auto grid md:grid-cols-3 gap-6">
<!-- FORM -->
<div class="md:col-span-2 bg-[#141414] border border-[#2a2410] rounded-[28px] p-6 md:p-8">
  <p class="font-black tracking-widest text-sm mb-5">✍️ SMIYA DYAL LI KAY-KTEB <span class="gold">(NTA)</span></p>
  <div class="grid grid-cols-2 gap-3">
    <input id="vendeurNom" placeholder="Smiytek - Ex: Youssef" class="bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-sm col-span-2">
    <input id="vendeurTel" placeholder="Nmra dyalek - 06 XX XX XX XX" class="bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-sm">
    <input id="vendeurMail" placeholder="Gmail dyalek - Ex: youssef@gmail.com" class="bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-sm">
  </div>

  <p class="font-black tracking-widest text-sm mt-7 mb-5">👤 CLIENT</p>
  <div class="grid grid-cols-2 gap-3">
    <input id="client" placeholder="Smiya dyal Client - Ex: Omar" class="bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-sm col-span-2">
    <input id="clientTel" placeholder="Téléphone Client" class="bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-sm col-span-2">
  </div>

  <p class="font-black tracking-widest text-sm mt-7 mb-3">🛍️ LES SERVICES / PRODUITS</p>
  <div id="lignes"></div>
  <button onclick="zidLigne()" class="w-full mt-3 border border-dashed border-[#D4AF37] text-[#D4AF37] rounded-2xl py-3 font-bold text-sm">+ ZID LIGNE JADIDA</button>

  <div class="flex gap-3 mt-6">
    <button onclick="sayeb()" class="flex-1 bg-gold text-black font-black rounded-2xl py-4 tracking-widest">SAYEB FACTURE ✨</button>
    <button onclick="window.print()" class="px-6 bg-white text-black font-bold rounded-2xl">PDF / PRINT</button>
  </div>
  <p id="totalTxt" class="text-right serif text-3xl gold font-bold mt-5">Total: 0 DH</p>
</div>

<!-- HISTORIQUE -->
<div class="bg-[#141414] border border-[#2a2410] rounded-[28px] p-6">
  <p class="font-black tracking-widest text-sm">📜 HISTORIQUE</p>
  <p class="text-xs text-zinc-500 mt-1">Ga3 les factures li sayebti</p>
  <div id="hist" class="mt-5 space-y-3"></div>
  <button onclick="localStorage.removeItem('factures');afficherHist()" class="text-xs text-red-400 mt-5 underline">Mseh l-historique</button>
</div>
</div>

<!-- FACTURE A IMPRIMER -->
<div id="facture" class="max-w-4xl mx-auto bg-white text-black rounded-[32px] overflow-hidden mt-8 hidden">
  <div class="p-8 md:p-10 flex justify-between">
    <div><p class="font-black tracking-widest">FACTURE POWER</p><p class="text-xs gold tracking-widest">LUXURY EDITION</p><p id="fVendeur" class="mt-6 font-bold text-lg"></p><p id="fVendeurInfo" class="text-sm text-zinc-500"></p></div>
    <div class="text-right"><p class="text-xs tracking-widest text-zinc-400">FACTURE N°</p><p id="fNum" class="serif text-3xl font-bold"></p><p id="fDate" class="text-sm mt-2"></p></div>
  </div>
  <div class="px-8 py-6 bg-[#fcfbf7] border-y flex justify-between"><div><p class="text-xs tracking-widest text-zinc-400">FACTURÉ À</p><p id="fClient" class="serif text-2xl font-bold"></p><p id="fClientTel" class="text-sm text-zinc-500"></p></div><div class="text-right"><p class="text-xs tracking-widest text-zinc-400">TOTAL</p><p id="fTotal" class="serif text-4xl font-bold gold"></p></div></div>
  <div class="p-8"><table class="w-full text-sm"><thead><tr class="text-xs text-zinc-400 border-b"><th class="text-left py-3">SERVICE / PRODUIT</th><th class="text-center">QTÉ</th><th class="text-right">PRIX</th><th class="text-right">TOTAL</th></tr></thead><tbody id="fLignes"></tbody></table><p class="text-center text-xs text-zinc-400 mt-10 tracking-widest">MERCI POUR VOTRE CONFIANCE ✨</p><p id="fFooter" class="text-center text-xs text-zinc-400 mt-2"></p></div>
</div>

<script>
let services=["iPhone 13","iPhone 14","Réparation Écran","Réparation Batterie","Accessoires","AirPods","Samsung","Autre..."];
function ligneHTML(){
  let opts=services.map(s=>`<option>${s}</option>`).join('');
  return `<div class="ligne grid grid-cols-12 gap-2 mt-2"><select class="serv col-span-5 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-3 text-sm"><option>Choisir Service...</option>${opts}</select><input class="qte col-span-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-3 text-sm" type="number" value="1" oninput="calcul()"><input class="prix col-span-3 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-3 text-sm" type="number" placeholder="Prix DH" oninput="calcul()"><button onclick="this.parentElement.remove();calcul()" class="col-span-2 bg-red-500/20 text-red-400 rounded-xl font-bold">X</button></div>`;
}
function zidLigne(){document.getElementById('lignes').insertAdjacentHTML('beforeend',ligneHTML())}
zidLigne(); zidLigne();
function calcul(){let t=0;document.querySelectorAll('.ligne').forEach(l=>{let q=+l.querySelector('.qte').value||0,p=+l.querySelector('.prix').value||0;t+=q*p});document.getElementById('totalTxt').innerText='Total: '+t+' DH';return t}
function sayeb(){
  let total=calcul(); if(!document.getElementById('client').value){alert('Kteb smiya dyal client!');return}
  let num='FP-'+Date.now().toString().slice(-5);
  document.getElementById('facture').classList.remove('hidden');
  document.getElementById('fNum').innerText=num;
  document.getElementById('fDate').innerText=new Date().toLocaleDateString('fr-FR');
  document.getElementById('fVendeur').innerText=document.getElementById('vendeurNom').value||'Facture Power';
  document.getElementById('fVendeurInfo').innerText=(document.getElementById('vendeurTel').value||'')+' • '+(document.getElementById('vendeurMail').value||'');
  document.getElementById('fClient').innerText=document.getElementById('client').value;
  document.getElementById('fClientTel').innerText=document.getElementById('clientTel').value;
  document.getElementById('fTotal').innerText=total+' DH';
  document.getElementById('fFooter').innerText=(document.getElementById('vendeurNom').value||'')+' • '+(document.getElementById('vendeurMail').value||'');
  let html='';document.querySelectorAll('.ligne').forEach(l=>{let s=l.querySelector('.serv').value,q=+l.querySelector('.qte').value||0,p=+l.querySelector('.prix').value||0; if(p>0) html+=`<tr class="border-b"><td class="py-4 font-bold">${s}</td><td class="text-center">${q}</td><td class="text-right">${p} DH</td><td class="text-right font-bold">${q*p} DH</td></tr>`});
  document.getElementById('fLignes').innerHTML=html;
  let h=JSON.parse(localStorage.getItem('factures')||'[]');h.unshift({num,client:document.getElementById('client').value,total,date:new Date().toLocaleDateString('fr-FR')});localStorage.setItem('factures',JSON.stringify(h.slice(0,20)));afficherHist();
  document.getElementById('facture').scrollIntoView({behavior:'smooth'});
}
function afficherHist(){let h=JSON.parse(localStorage.getItem('factures')||'[]');document.getElementById('hist').innerHTML=h.length?h.map(f=>`<div class="bg-zinc-900 rounded-2xl p-4"><p class="font-bold text-sm">${f.client} - <span class="gold">${f.total} DH</span></p><p class="text-xs text-zinc-500">${f.num} • ${f.date}</p></div>`).join(''):'<p class="text-zinc-500 text-sm">Ba9i ma sayebti 7ta facture</p>'}
afficherHist();
</script></body></html>
